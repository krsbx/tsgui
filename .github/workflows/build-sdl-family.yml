# Build the whole SDL3 family in one run — SDL3, SDL3_image, SDL3_ttf,
# SDL3_mixer and the SDL_shadercross CLI — by calling the per-library
# workflows (build-sdl.yml, build-sdl-image.yml, build-sdl-ttf.yml,
# build-sdl-mixer.yml, build-sdl-shadercross.yml). Each one still
# publishes its own tsgui release (SDL3-<v>, SDL3_image-<v>, …); this just
# resolves the tags up front and links every satellite against the same SDL3
# tag that gets published.
#
# Trigger: Actions → "Build SDL family" → Run workflow
#   owner     — GitHub owner the four repos live under (owner/SDL,
#               owner/SDL_image, owner/SDL_ttf, owner/SDL_mixer)
#   sdl3_tag  — SDL3 tag, e.g. release-3.4.14
#   image_tag — SDL_image tag, e.g. release-3.2.4
#   ttf_tag   — SDL_ttf tag, e.g. release-3.2.2
#   mixer_tag — SDL_mixer tag, e.g. release-3.2.4
# Any blank tag = newest stable release-3.x of that repo.
#   shadercross_ref — SDL_shadercross branch/commit (upstream has no release
#               tags; default main). Blank = skip shadercross — its macOS
#               job builds DXC from source and takes 30-90 min.

name: Build SDL family

on:
  workflow_dispatch:
    inputs:
      owner:
        description: Repository owner for SDL, SDL_image, SDL_ttf, SDL_mixer
        required: true
        default: "libsdl-org"
        type: string
      sdl3_tag:
        description: SDL3 tag (blank = latest stable release-3.x)
        required: false
        default: ""
        type: string
      image_tag:
        description: SDL_image tag (blank = latest stable release-3.x)
        required: false
        default: ""
        type: string
      ttf_tag:
        description: SDL_ttf tag (blank = latest stable release-3.x)
        required: false
        default: ""
        type: string
      mixer_tag:
        description: SDL_mixer tag (blank = latest stable release-3.x)
        required: false
        default: ""
        type: string
      shadercross_ref:
        description: SDL_shadercross branch/commit (blank = skip shadercross)
        required: false
        default: main
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      sdl3_tag: ${{ steps.prep.outputs.sdl3_tag }}
      image_tag: ${{ steps.prep.outputs.image_tag }}
      ttf_tag: ${{ steps.prep.outputs.ttf_tag }}
      mixer_tag: ${{ steps.prep.outputs.mixer_tag }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - id: prep
        env:
          OWNER: ${{ inputs.owner }}
          SDL3_TAG: ${{ inputs.sdl3_tag }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          TTF_TAG: ${{ inputs.ttf_tag }}
          MIXER_TAG: ${{ inputs.mixer_tag }}
        run: |
          set -euo pipefail

          if [[ ! "$OWNER" =~ ^[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::owner must be a GitHub user/org name, got: $OWNER"
            exit 1
          fi

          # Explicit tag wins; blank → newest stable release-3.x (the SDL
          # repos also cut 2.x maintenance releases, which must be skipped).
          resolve() {
            local repo=$1 tag=$2
            if [[ -z "$tag" ]]; then
              tag=$(gh api "repos/$OWNER/$repo/releases?per_page=30" \
                --jq '[.[] | select(.draft == false and .prerelease == false
                  and (.tag_name | startswith("release-3.")))][0].tag_name')
            fi
            if [[ -z "$tag" || "$tag" == null ]]; then
              echo "::error::no stable release-3.x found for $OWNER/$repo — pass a tag"
              exit 1
            fi
            echo "$OWNER/$repo → $tag" >&2
            echo "$tag"
          }

          # Plain assignments so a failed resolve trips set -e.
          sdl3=$(resolve SDL "$SDL3_TAG")
          image=$(resolve SDL_image "$IMAGE_TAG")
          ttf=$(resolve SDL_ttf "$TTF_TAG")
          mixer=$(resolve SDL_mixer "$MIXER_TAG")
          {
            echo "sdl3_tag=$sdl3"
            echo "image_tag=$image"
            echo "ttf_tag=$ttf"
            echo "mixer_tag=$mixer"
          } >> "$GITHUB_OUTPUT"

  # All run in parallel — each satellite builds its own SDL3 (pinned to
  # the same tag) to link against, so none waits on the SDL3 job.
  sdl3:
    name: SDL3
    needs: prepare
    permissions:
      contents: write
    uses: ./.github/workflows/build-sdl.yml
    with:
      tag: ${{ needs.prepare.outputs.sdl3_tag }}
      repo: ${{ inputs.owner }}/SDL

  image:
    name: SDL3_image
    needs: prepare
    permissions:
      contents: write
    uses: ./.github/workflows/build-sdl-image.yml
    with:
      tag: ${{ needs.prepare.outputs.image_tag }}
      repo: ${{ inputs.owner }}/SDL_image
      sdl3_tag: ${{ needs.prepare.outputs.sdl3_tag }}

  ttf:
    name: SDL3_ttf
    needs: prepare
    permissions:
      contents: write
    uses: ./.github/workflows/build-sdl-ttf.yml
    with:
      tag: ${{ needs.prepare.outputs.ttf_tag }}
      repo: ${{ inputs.owner }}/SDL_ttf
      sdl3_tag: ${{ needs.prepare.outputs.sdl3_tag }}

  mixer:
    name: SDL3_mixer
    needs: prepare
    permissions:
      contents: write
    uses: ./.github/workflows/build-sdl-mixer.yml
    with:
      tag: ${{ needs.prepare.outputs.mixer_tag }}
      repo: ${{ inputs.owner }}/SDL_mixer
      sdl3_tag: ${{ needs.prepare.outputs.sdl3_tag }}

  shadercross:
    name: SDL_shadercross
    needs: prepare
    if: inputs.shadercross_ref != ''
    permissions:
      contents: write
    uses: ./.github/workflows/build-sdl-shadercross.yml
    with:
      ref: ${{ inputs.shadercross_ref }}
      repo: ${{ inputs.owner }}/SDL_shadercross
      sdl3_tag: ${{ needs.prepare.outputs.sdl3_tag }}
