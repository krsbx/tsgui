# Build SDL_shadercross (the HLSL → SPIR-V / MSL / DXIL offline translator)
# and publish the CLI tool as tsgui release assets — the toolchain the phase
# 2.5 SDF spike needs (ROADMAP.md: shaders authored in HLSL, cross-compiled
# offline, blobs checked in).
#
# Differences from the SDL-family workflows (build-sdl*.yml):
# - Upstream has NO release tags — input is a git ref (default main) and the
#   tsgui release is tagged SDL_shadercross-<short-sha> unless overridden.
# - The artifact is an offline CLI tool plus its bundled libraries, not a
#   runtime dylib. SDLSHADERCROSS_INSTALL_RUNTIME=ON installs dxcompiler,
#   spirv-cross, vkd3d and SDL3 into lib/ and sets the CLI's RPATH to
#   $ORIGIN/../lib (@executable_path/../lib on macOS), so the archive keeps
#   the bin/ + lib/ layout — flattening it would break that RPATH.
# - Prebuilt mode (default, input prebuilt=true): upstream's own CI already
#   builds this exact bundle (INSTALL_RUNTIME, vendored DXC on macOS,
#   universal2) for every push to main and keeps the packages 90 days. When
#   a successful upstream run exists for the resolved commit, each platform
#   job downloads its package into prefix/ instead of compiling — a few
#   minutes instead of the ~30-40 min macOS DXC (LLVM) build. Packages used:
#     linux   → SDL3_shadercross-slrsniper   (Steam Runtime sniper, glibc 2.31+)
#     macos   → SDL3_shadercross-macos-arm64 (universal2 despite the name)
#     windows → SDL3_shadercross-VC-x64      (MSVC)
#   Downloading another repo's artifacts may need more than GITHUB_TOKEN; if
#   so, add a read-only PAT as the SHADERCROSS_ARTIFACT_TOKEN repo secret.
# - Source mode (fallback when no unexpired upstream run exists, the token
#   can't download, or prebuilt=false): macOS builds the SDL-forked DXC from
#   source (SDLSHADERCROSS_VENDORED=ON — upstream DXC ships no macOS
#   binaries); Linux/Windows download prebuilt DXC per upstream's own CI.
# - Both modes share Collect → Audit → Package → Smoke: the smoke test
#   extracts the packaged archive and runs HLSL → SPIR-V → MSL with the CLI
#   inside it, no loader-path overrides — a broken RPATH or missing bundled
#   lib fails here, not on your machine.
#
# Build recipe mirrored from libsdl-org/SDL_shadercross's own
# .github/workflows/main.yml (vendored/prebuilt splits, env-var discovery,
# macOS universal2 flags included).

name: Build SDL ShaderCross

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch / tag / commit to build (upstream has no release tags)
        required: false
        default: main
        type: string
      repo:
        description: Repository, e.g. libsdl-org/SDL_shadercross
        required: true
        default: "libsdl-org/SDL_shadercross"
        type: string
      release_tag:
        description: tsgui release tag (blank = SDL_shadercross-<short sha>)
        required: false
        default: ""
        type: string
      sdl3_tag:
        description: SDL3 tag to link against (blank = latest stable release)
        required: false
        default: ""
        type: string
      prebuilt:
        description: Use upstream CI's prebuilt package when one exists for the commit (falls back to building from source)
        required: false
        default: true
        type: boolean
  # Same inputs, so build-sdl-family.yml can call this workflow.
  workflow_call:
    inputs:
      ref:
        description: Branch / tag / commit to build (upstream has no release tags)
        required: false
        default: main
        type: string
      repo:
        description: Repository, e.g. libsdl-org/SDL_shadercross
        required: true
        default: "libsdl-org/SDL_shadercross"
        type: string
      release_tag:
        description: tsgui release tag (blank = SDL_shadercross-<short sha>)
        required: false
        default: ""
        type: string
      sdl3_tag:
        description: SDL3 tag to link against (blank = latest stable release)
        required: false
        default: ""
        type: string
      prebuilt:
        description: Use upstream CI's prebuilt package when one exists for the commit (falls back to building from source)
        required: false
        default: true
        type: boolean
    secrets:
      SHADERCROSS_ARTIFACT_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.prep.outputs.short_sha }}
      mode: ${{ steps.prep.outputs.mode }}
      upstream_run: ${{ steps.prep.outputs.upstream_run }}
      release_tag: ${{ steps.prep.outputs.release_tag }}
      sdl3_repo: ${{ steps.prep.outputs.sdl3_repo }}
      sdl3_tag: ${{ steps.prep.outputs.sdl3_tag }}
    env:
      GH_TOKEN: ${{ secrets.SHADERCROSS_ARTIFACT_TOKEN || github.token }}
    steps:
      - id: prep
        env:
          REF: ${{ inputs.ref }}
          REPO: ${{ inputs.repo }}
          PREBUILT: ${{ inputs.prebuilt }}
          # Keep in sync with matrix.upstream_artifact below.
          UPSTREAM_ARTIFACTS: SDL3_shadercross-slrsniper SDL3_shadercross-macos-arm64 SDL3_shadercross-VC-x64
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
          SDL3_TAG_INPUT: ${{ inputs.sdl3_tag }}
        run: |
          set -euo pipefail

          if [[ ! "$REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::repo must look like owner/name, got: $REPO"
            exit 1
          fi

          full_sha=$(gh api "repos/$REPO/commits/$REF" --jq '.sha')
          short_sha=${full_sha:0:7}

          # Prebuilt mode: a successful upstream main.yml run for this exact
          # commit, all three packages unexpired, and a token that can
          # actually download them (artifact zip → 302 redirect).
          mode=build
          upstream_run=""
          if [[ "$PREBUILT" == true ]]; then
            upstream_run=$(gh api "repos/$REPO/actions/runs?head_sha=$full_sha&status=success&per_page=50" \
              --jq '[.workflow_runs[] | select(.path == ".github/workflows/main.yml")][0].id // empty')
            if [[ -z "$upstream_run" ]]; then
              echo "::warning::no successful upstream CI run for $REPO@$short_sha — building from source"
            else
              arts=$(gh api "repos/$REPO/actions/runs/$upstream_run/artifacts?per_page=100" \
                --jq '[.artifacts[] | select(.expired == false)]')
              missing=""
              for n in $UPSTREAM_ARTIFACTS; do
                jq -e --arg n "$n" 'any(.[]; .name == $n)' <<<"$arts" >/dev/null || missing="$missing $n"
              done
              if [[ -n "$missing" ]]; then
                echo "::warning::upstream run $upstream_run lacks (or expired):$missing — building from source"
                upstream_run=""
              else
                probe=$(jq -r '.[0].id' <<<"$arts")
                code=$(curl -s -o /dev/null -w '%{http_code}' \
                  -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                  "https://api.github.com/repos/$REPO/actions/artifacts/$probe/zip")
                if [[ "$code" == 302 ]]; then
                  mode=prebuilt
                  echo "Using upstream CI run $upstream_run: https://github.com/$REPO/actions/runs/$upstream_run"
                else
                  echo "::warning::token cannot download upstream artifacts (HTTP $code) — add a read-only PAT as the SHADERCROSS_ARTIFACT_TOKEN secret. Building from source."
                  upstream_run=""
                fi
              fi
            fi
          fi

          # SDL3 comes from the same owner (owner/SDL_shadercross → owner/SDL).
          sdl3_repo="${REPO%%/*}/SDL"

          if [[ -n "$RELEASE_TAG_INPUT" ]]; then
            release_tag=$RELEASE_TAG_INPUT
          else
            release_tag="SDL_shadercross-$short_sha"
          fi

          if [[ -n "$SDL3_TAG_INPUT" ]]; then
            sdl3_tag=$SDL3_TAG_INPUT
          else
            sdl3_tag=$(gh api "repos/$sdl3_repo/releases?per_page=30" \
              --jq '[.[] | select(.draft == false and .prerelease == false
                and (.tag_name | startswith("release-3.")))][0].tag_name')
          fi

          {
            echo "short_sha=$short_sha"
            echo "mode=$mode"
            echo "upstream_run=$upstream_run"
            echo "release_tag=$release_tag"
            echo "sdl3_repo=$sdl3_repo"
            echo "sdl3_tag=$sdl3_tag"
          } >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.platform }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-24.04
            upstream_artifact: SDL3_shadercross-slrsniper
            vendored: "OFF"
            osx_flags: ""
            osx_cflags: ""
          - platform: macos
            os: macos-15
            upstream_artifact: SDL3_shadercross-macos-arm64
            vendored: "ON"
            osx_flags: "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0"
            osx_cflags: "-DCMAKE_C_FLAGS=-mmacosx-version-min=11.0 -DCMAKE_CXX_FLAGS=-mmacosx-version-min=11.0"
          - platform: windows
            os: windows-latest
            upstream_artifact: SDL3_shadercross-VC-x64
            vendored: "OFF"
            osx_flags: ""
            osx_cflags: ""
    defaults:
      run:
        shell: bash
    steps:
      # Prebuilt mode: upstream CI's CPack package is one top-level folder
      # (bin/ lib/ share/ …) — exactly an install prefix, so it becomes
      # prefix/ and the Collect/Audit/Package/Smoke steps run unchanged.
      - name: Fetch upstream CI package (prebuilt mode)
        if: needs.prepare.outputs.mode == 'prebuilt'
        env:
          GH_TOKEN: ${{ secrets.SHADERCROSS_ARTIFACT_TOKEN || github.token }}
          REPO: ${{ inputs.repo }}
          RUN_ID: ${{ needs.prepare.outputs.upstream_run }}
          ARTIFACT: ${{ matrix.upstream_artifact }}
        run: |
          set -euo pipefail
          echo "Fetching $ARTIFACT from https://github.com/$REPO/actions/runs/$RUN_ID"
          gh run download "$RUN_ID" -R "$REPO" -n "$ARTIFACT" -D upstream
          ls -la upstream

          pkg=$(find upstream -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) | head -n1)
          mkdir -p upstream-x
          case "$pkg" in
            *.zip)
              powershell -NoProfile -Command \
                "Expand-Archive -Path '$pkg' -DestinationPath 'upstream-x'"
              ;;
            *.tar.gz)
              tar -xzf "$pkg" -C upstream-x
              ;;
            *)
              echo "::error::no .tar.gz/.zip package inside $ARTIFACT"
              exit 1
              ;;
          esac

          top=$(find upstream-x -mindepth 1 -maxdepth 1 -type d | head -n1)
          if [[ -z "$top" || ! -d "$top/bin" ]]; then
            echo "::error::unexpected package layout in $ARTIFACT (no <dir>/bin)"
            exit 1
          fi
          mv "$top" prefix
          echo "== prefix/bin:"; ls prefix/bin
          echo "== prefix/lib:"; ls prefix/lib || true

      # SDL 3.4 hard-fails without XTest; the vulkan-loader that
      # INSTALL_RUNTIME builds wants the X11/Wayland headers too. patchelf is
      # REQUIRED by INSTALL_RUNTIME on Linux; bison + libjson-perl by vkd3d.
      - name: Install Linux build deps (SDL3 backends + shadercross extras)
        if: needs.prepare.outputs.mode == 'build' && matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config patchelf bison \
            libx11-dev libxext-dev libxcursor-dev libxfixes-dev libxi-dev \
            libxrandr-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdecor-0-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev \
            libdbus-1-dev libudev-dev \
            libdrm-dev libgbm-dev libegl1-mesa-dev libgl1-mesa-dev \
            libibus-1.0-dev \
            libjson-perl

      - name: Install macOS build deps (bison + JSON for vendored vkd3d, ninja)
        if: needs.prepare.outputs.mode == 'build' && matrix.platform == 'macos'
        run: |
          brew install bison cpanm ninja
          cpanm JSON
          echo "/opt/homebrew/opt/bison/bin" >> "$GITHUB_PATH"

      # macOS compiles the vendored DXC (LLVM) twice for universal2 — ~30 min
      # cold, same as upstream CI. ccache, persisted across runs, makes
      # rebuilds of an unchanged DXC submodule mostly cache hits.
      - name: Set up ccache (vendored DXC build)
        if: needs.prepare.outputs.mode == 'build' && matrix.platform == 'macos'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: shadercross-macos
          max-size: 3G

      # INSTALL_RUNTIME resolves spirv-cross's DLL deps with dumpbin, which is
      # only on PATH inside an MSVC dev shell (upstream CI does the same).
      - name: Set up MSVC dev environment
        if: needs.prepare.outputs.mode == 'build' && matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Bare `cmake --build --parallel` means unbounded `make -j` under the
      # Makefiles generator — on the 3-vCPU / 7 GB macOS runner the DXC (LLVM)
      # build swaps itself to a standstill. Pin jobs to the core count.
      - name: Pin build parallelism
        if: needs.prepare.outputs.mode == 'build'
        run: |
          jobs=$(getconf _NPROCESSORS_ONLN 2>/dev/null || echo "${NUMBER_OF_PROCESSORS:-2}")
          echo "BUILD_JOBS=$jobs" >> "$GITHUB_ENV"
          echo "Building with $jobs parallel jobs"

      - name: Checkout SDL_shadercross source (with toolchain submodules)
        if: needs.prepare.outputs.mode == 'build'
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.ref }}
          path: lib-src
          submodules: recursive

      - name: Checkout SDL3 (link dependency)
        if: needs.prepare.outputs.mode == 'build'
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.prepare.outputs.sdl3_repo }}
          ref: ${{ needs.prepare.outputs.sdl3_tag }}
          path: sdl3-src

      - name: Build + install SDL3 into a local prefix
        if: needs.prepare.outputs.mode == 'build'
        env:
          OSX_FLAGS: ${{ matrix.osx_flags }}
        run: |
          set -euo pipefail
          cmake -S sdl3-src -B sdl3-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF \
            $OSX_FLAGS
          cmake --build sdl3-build --config Release --parallel "$BUILD_JOBS"
          cmake --install sdl3-build --config Release --prefix "$PWD/sdl3-prefix"
          ls sdl3-prefix/lib

      - name: Build SPIRV-Cross (shadercross discovers it via _ROOT below)
        if: needs.prepare.outputs.mode == 'build'
        env:
          OSX_FLAGS: ${{ matrix.osx_flags }}
          OSX_CFLAGS: ${{ matrix.osx_cflags }}
        run: |
          set -euo pipefail
          cmake -S lib-src/external/SPIRV-Cross -B spirv_cross_build \
            -DCMAKE_BUILD_TYPE=Release \
            -DSPIRV_CROSS_SHARED=ON -DSPIRV_CROSS_STATIC=ON \
            $OSX_FLAGS $OSX_CFLAGS
          cmake --build spirv_cross_build --config Release --parallel "$BUILD_JOBS"
          cmake --install spirv_cross_build --config Release --prefix "$PWD/spirv_cross_prefix"

          # Windows paths go to cmake.exe as mixed-slash; separator differs.
          root="$PWD/spirv_cross_prefix"
          sep=":"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            root=$(cygpath -m "$root")
            sep=";"
          fi
          echo "spirv_cross_c_shared_ROOT=${root}${sep}${root}/share/spirv_cross_c_shared" >> "$GITHUB_ENV"

      - name: Download prebuilt DirectXShaderCompiler (per upstream CI)
        if: needs.prepare.outputs.mode == 'build' && matrix.vendored == 'OFF'
        run: |
          set -euo pipefail
          cmake -P lib-src/build-scripts/download-prebuilt-DirectXShaderCompiler.cmake

          # The script lands the binaries either beside itself or in CWD —
          # accept both, fail loud on neither.
          dxc_root=""
          for d in "$PWD/external/DirectXShaderCompiler-binaries" \
                   "$PWD/lib-src/external/DirectXShaderCompiler-binaries"; do
            if [[ -d "$d" ]]; then dxc_root="$d"; break; fi
          done
          if [[ -z "$dxc_root" ]]; then
            echo "::error::prebuilt DXC download did not land where expected"
            exit 1
          fi
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            dxc_root=$(cygpath -m "$dxc_root")
          fi
          echo "DirectXShaderCompiler_ROOT=$dxc_root" >> "$GITHUB_ENV"

      - name: Configure SDL_shadercross
        if: needs.prepare.outputs.mode == 'build'
        env:
          VENDORED: ${{ matrix.vendored }}
          OSX_FLAGS: ${{ matrix.osx_flags }}
          OSX_CFLAGS: ${{ matrix.osx_cflags }}
        run: |
          set -euo pipefail
          # No RPATH flags: INSTALL_RUNTIME sets the CLI's INSTALL_RPATH to
          # $ORIGIN/../lib itself (overriding CMAKE_INSTALL_RPATH) and adds
          # $ORIGIN / @loader_path to every bundled library.
          # macOS: Ninja (as upstream CI) + ccache for the vendored DXC build.
          gen_flags=""
          if [[ "$RUNNER_OS" == macOS ]]; then
            gen_flags="-G Ninja -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache"
          fi
          cmake -S lib-src -B build $gen_flags \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDLSHADERCROSS_CLI=ON \
            -DSDLSHADERCROSS_SHARED=ON -DSDLSHADERCROSS_STATIC=ON \
            -DSDLSHADERCROSS_VENDORED=$VENDORED \
            -DSDLSHADERCROSS_INSTALL=ON \
            -DSDLSHADERCROSS_INSTALL_RUNTIME=ON \
            -DCMAKE_PREFIX_PATH="$PWD/sdl3-prefix" \
            $OSX_FLAGS $OSX_CFLAGS

      - name: Build + install SDL_shadercross
        if: needs.prepare.outputs.mode == 'build'
        run: |
          set -euo pipefail
          cmake --build build --config Release --parallel "$BUILD_JOBS"
          if command -v ccache >/dev/null; then ccache --show-stats || true; fi
          cmake --install build --config Release --prefix "$PWD/prefix"
          echo "== prefix/bin:"; ls prefix/bin
          echo "== prefix/lib:"; ls prefix/lib || true

      # Not PLATFORM: the MSVC dev env exports Platform=x64, and Windows env
      # names are case-insensitive — bash would only ever see "Platform".
      - name: Collect CLI + bundled libraries
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          # Keep the installed bin/ + lib/ layout — the CLI's RPATH is
          # $ORIGIN/../lib. -a preserves the soname symlinks.
          mkdir -p staging/bin
          cp -a prefix/bin/. staging/bin/
          case "$TARGET_PLATFORM" in
            linux)
              mkdir -p staging/lib
              find prefix/lib -maxdepth 1 -name "*.so*" -exec cp -a {} staging/lib/ \;
              ;;
            macos)
              mkdir -p staging/lib
              find prefix/lib -maxdepth 1 -name "*.dylib" -exec cp -a {} staging/lib/ \;
              ;;
            windows)
              # DLLs install beside the exe; catch any that landed in lib/.
              find prefix/lib -maxdepth 1 -name "*.dll" -exec cp -n {} staging/bin/ \; 2>/dev/null || true
              ;;
          esac
          if [[ -d prefix/share/licenses ]]; then
            mkdir -p staging/share
            cp -a prefix/share/licenses staging/share/
          fi
          find staging | sort

      - name: Audit dependencies (fail loud on leaked build-machine paths)
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          case "$TARGET_PLATFORM" in
            macos)
              bins=$(find staging/bin staging/lib -type f)
              if otool -L $bins | grep -E '/opt/homebrew|/usr/local/'; then
                echo "::error::binary links against Homebrew paths — not self-contained"
                exit 1
              fi
              otool -L $bins
              ;;
            linux)
              for f in $(find staging/bin staging/lib -type f); do
                echo "== $f"
                readelf -d "$f" | grep -E 'NEEDED|RUNPATH|RPATH' || true
              done
              ;;
          esac

      - name: Package (${{ matrix.platform }})
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          name="SDL_shadercross_${TARGET_PLATFORM}"
          case "$TARGET_PLATFORM" in
            windows)
              powershell -NoProfile -Command \
                "Compress-Archive -Path 'staging/*' -DestinationPath '${name}.zip' -Force"
              ;;
            *)
              tar -czf "${name}.tar.gz" -C staging .
              ;;
          esac
          ls -la "${name}".*

      - name: Smoke — compile a real HLSL shader with the packaged CLI
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          # Runs the CLI from the extracted archive — exactly what ships —
          # with no loader-path overrides, so RPATH / bundling bugs fail here.
          rm -rf smoke && mkdir smoke
          case "$TARGET_PLATFORM" in
            windows)
              powershell -NoProfile -Command \
                "Expand-Archive -Path 'SDL_shadercross_windows.zip' -DestinationPath 'smoke'"
              cli="$PWD/smoke/bin/shadercross.exe"
              ;;
            *)
              tar -xzf "SDL_shadercross_${TARGET_PLATFORM}.tar.gz" -C smoke
              cli="$PWD/smoke/bin/shadercross"
              ;;
          esac
          test -f "$cli"

          "$cli" -h > /dev/null

          cat > smoke.hlsl <<'EOF'
          Texture2D gTexture : register(t0);
          SamplerState gSampler : register(s0);

          float4 main(float2 vTexCoord : TEXCOORD0) : SV_Target0
          {
              return gTexture.Sample(gSampler, vTexCoord);
          }
          EOF

          # HLSL → SPIR-V exercises dxcompiler; SPIR-V → MSL exercises
          # spirv-cross. Positional input; dest inferred from the extension.
          "$cli" smoke.hlsl -o smoke.spv -t fragment
          test -s smoke.spv
          "$cli" smoke.spv -o smoke.msl -t fragment
          test -s smoke.msl
          echo "smoke.spv: $(wc -c < smoke.spv) bytes, smoke.msl: $(wc -c < smoke.msl) bytes"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: asset-SDL_shadercross-${{ matrix.platform }}
          path: SDL_shadercross_${{ matrix.platform }}.*
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: asset-SDL_shadercross-*
          path: dist
          merge-multiple: true

      - name: Publish release ${{ needs.prepare.outputs.release_tag }}
        env:
          VERSION: ${{ needs.prepare.outputs.short_sha }}
          MODE: ${{ needs.prepare.outputs.mode }}
          UPSTREAM_RUN: ${{ needs.prepare.outputs.upstream_run }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          REF: ${{ inputs.ref }}
          REPO: ${{ inputs.repo }}
        run: |
          set -euo pipefail
          cd dist
          ls -la

          if [[ "$MODE" == prebuilt ]]; then
            provenance="Binaries repackaged from upstream CI run [#$UPSTREAM_RUN](https://github.com/$REPO/actions/runs/$UPSTREAM_RUN) and smoke-tested by tsgui CI (HLSL → SPIR-V → MSL)."
            linux_desc="Steam Linux Runtime 3.0 (sniper) build, glibc >= 2.31"
          else
            provenance="Built from source by tsgui CI and smoke-tested (HLSL → SPIR-V → MSL)."
            linux_desc="ubuntu-24.04 build, glibc >= 2.39"
          fi

          notes=$(cat <<EOF
          Prebuilt **SDL_shadercross** CLI toolchain (source commit $VERSION,
          built from [$REPO @ $REF](https://github.com/$REPO/tree/$REF))
          — the offline HLSL → SPIR-V / MSL / DXIL translator the tsgui phase
          2.5 SDF spike compiles its shaders with.

          $provenance

          | Asset | Contents |
          | ----- | -------- |
          | SDL_shadercross_linux.tar.gz | x86_64 bin/shadercross + lib/ bundled .so libraries ($linux_desc) |
          | SDL_shadercross_macos.tar.gz | universal2 bin/shadercross (arm64 + x86_64) + lib/ bundled dylibs, DXC built from the SDL fork |
          | SDL_shadercross_windows.zip | x64 bin/shadercross.exe + DLLs |

          Each archive is self-contained: the CLI finds its bundled
          dxcompiler / spirv-cross / SDL3 libraries in ../lib via RPATH, so
          after extracting (keep the bin/ + lib/ layout) it runs directly:

              ./bin/shadercross shader.hlsl -o shader.spv -t fragment

          Upstream has no release tags yet — releases here are pinned to a
          source commit (see the tag name).
          EOF
          )

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG exists — replacing assets"
            gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber ./*
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "SDL_shadercross $VERSION" --notes "$notes" ./*
          fi
