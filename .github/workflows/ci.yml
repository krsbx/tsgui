name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Install SDL3
        run: brew install sdl3
      - name: Install dependencies
        run: bun install
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Codegen is up to date
        run: bun run codegen:all -- --check
      - name: Smoke (bun:ffi)
        run: bun run smoke
      - name: Smoke (node:ffi)
        run: bun run smoke:node
      - name: Hello selftest (bun:ffi)
        run: bun run hello -- --selftest
      - name: Hello selftest (node:ffi)
        run: node examples/hello.ts --selftest
